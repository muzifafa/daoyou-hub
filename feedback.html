<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反馈与共建 · 导游 Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232e5e4e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{--paper:#f6f2e9;--card:#fbf8f1;--ink:#26302a;--ink-soft:#5c675f;--pine:#2e5e4e;--pine-dark:#1f4437;--gold:#b9822a;--line:#d8cfba;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:15px}
h1,h2{font-family:"Noto Serif SC",serif}
a{color:var(--pine);text-decoration:none}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;background:rgba(246,242,233,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:18px;color:var(--pine-dark)}
.brand span{color:var(--gold)}
.navlinks a{margin-left:20px;font-size:14px;color:var(--ink-soft)}
.head{background:var(--pine-dark);color:#f4efe2;padding:40px 0;text-align:center}
.head h1{font-size:28px;margin-bottom:8px}
.head p{color:#cfd8cc;font-size:14px}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;margin:32px auto}
.form label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 4px}
.form input,.form textarea,.form select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;font-family:inherit}
.form input:focus,.form textarea:focus,.form select:focus{outline:none;border-color:var(--pine)}
.form button{margin-top:20px;width:100%;background:var(--gold);color:#fff;border:none;padding:13px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer}
.msg{padding:14px;border-radius:8px;margin-top:16px;font-size:14px;display:none;text-align:center}
.msg.ok{background:#d4ead8;color:#1f5c33;display:block}
.msg.err{background:#f3d4cd;color:#8a2a1a;display:block}
.note{font-size:13px;color:var(--ink-soft);margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<nav><div class="wrap">
<a class="brand" href="/">导游<span>Hub</span></a>
<div class="navlinks">
<a href="/map.html">景区地图</a>
<a href="/guides.html">导游名录</a>
<a href="/jobs.html">找团需求</a>
<a href="/feedback.html">反馈</a>
</div>
</div></nav>

<header class="head"><div class="wrap">
<h1>反馈与共建</h1>
<p>景区政策变了、数据错了、新景区没收录？填个表告诉我们，普通导游也能用，不用会编程。</p>
</div></header>

<section class="wrap">
<form class="form" id="f">
<label>反馈类型 *</label>
<select name="type" required>
<option value="">请选择</option>
<option>景区免票政策有变</option>
<option>地图上的景区位置错了</option>
<option>发现新景区应收录</option>
<option>导游名录 / 找团需求相关</option>
<option>网站 Bug / 建议</option>
<option>其他</option>
</select>
<label>涉及景区（如知道）</label>
<input name="spot" placeholder="如 台儿庄古城 / 华山风景区">
<label>具体内容 *</label>
<textarea name="content" rows="4" required placeholder="请描述你发现的问题或实测情况，例如：2026年10月亲测，XX景区持导游证不免首道门票，需带团计划单"></textarea>
<label>你的称呼 / 联系方式（选填）</label>
<input name="contact" placeholder="方便我们核实后回复你">
<button type="submit">提交反馈</button>
<div class="msg" id="msg"></div>
<p class="note">提交后维护者会核实并更新到数据库，所有导游受益。政策可能随时间变化，出行前请以景区当日公示为准。</p>
</form>
</section>

<script>
document.getElementById('f').onsubmit=async(e)=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const body=Object.fromEntries(fd.entries());
  const msg=document.getElementById('msg');
  const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){msg.className='msg ok';msg.textContent='收到！感谢你的贡献，我们核实后会更新。';e.target.reset();}
  else{msg.className='msg err';msg.textContent='提交失败，请重试';}
};
</script>
</body></html>
