<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>重置密码 · 导游 Hub</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#203e35;font:16px/1.7 system-ui,sans-serif}main{max-width:480px;margin:8vh auto;padding:30px 24px;background:#fff;border-radius:18px}a{color:#245e4c}h1{font-size:28px}label{display:block;margin-top:20px;font-weight:600}input{display:block;width:100%;padding:12px;font:inherit;border:1px solid #9baaa3;border-radius:8px}button{margin-top:24px;width:100%;padding:13px;font:inherit;background:#245e4c;color:#fff;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #bd8a35;outline-offset:3px}p{color:#50635a}#status{white-space:pre-line}#status.error{color:#a12626}[hidden]{display:none!important}@media(max-width:520px){main{margin:24px 16px}}
  </style>
  <script type="module" src="/reset-password.js?v=20261028"></script>
</head>
<body><main>
  <a href="/">← 导游 Hub</a>
  <h1>设置新密码</h1>
  <p>一次性链接签发后 15 分钟内有效。成功重置后，其他设备需要重新登录。请自行输入新密码，不要把密码发给维护者。</p>
  <form id="reset-form" hidden>
    <label for="password">新密码（12 至 128 位）</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <label for="confirm-password">再次输入新密码</label>
    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <button id="submit" type="submit">更新密码</button>
  </form>
  <p id="status" role="status" aria-live="polite">正在检查重置链接…</p>
  <p id="sign-in" hidden><a href="/">返回首页，从右上角登录</a></p>
  <noscript>请启用 JavaScript 后使用重置链接。</noscript>
</main></body>
</html>
